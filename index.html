<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីថត និងបញ្ជូនរូបភាពសិស្ស</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Koulen&family=Moul&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Koulen', sans-serif;
        }
        .moul-font {
            font-family: 'Moul', cursive;
        }
        #video-container {
            position: relative;
            /* Force portrait aspect ratio */
            width: 100%;
            max-width: 360px; /* Limit width on larger screens */
            aspect-ratio: 3 / 4;
            margin-left: auto;
            margin-right: auto;
            background-color: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        #video, #canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the container, cropping if needed */
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 4px dashed rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-auto bg-white rounded-xl shadow-lg p-6 space-y-4">
        
        <div class="text-center">
            <h1 class="text-2xl font-bold text-blue-600 moul-font">កម្មវិធីថតរូបសិស្ស</h1>
            <p class="text-gray-500">បញ្ចូលអត្តលេខ ឬ ឈ្មោះដើម្បីចាប់ផ្តើម</p>
        </div>

        <!-- Section 1: Student Selection -->
        <div id="selection-container">
            <div id="loader" class="text-center text-blue-500">
                <p>កំពុងទាញយកទិន្នន័យ...</p>
            </div>
            <div class="relative hidden" id="search-form">
                <label for="student-search" class="block text-sm font-medium text-gray-700 mb-1">ស្វែងរកសិស្ស</label>
                <input type="text" id="student-search" list="student-list" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="វាយអត្តលេខ ឬ ឈ្មោះ...">
                <datalist id="student-list"></datalist>
            </div>
            <div id="student-info" class="mt-4 p-4 bg-blue-50 rounded-lg hidden">
                <h3 class="font-bold text-lg text-gray-800">ព័ត៌មានសិស្ស</h3>
                <p><strong>អត្តលេខ:</strong> <span id="info-id" class="text-blue-700"></span></p>
                <p><strong>ឈ្មោះ:</strong> <span id="info-name" class="text-blue-700"></span></p>
                <p><strong>ថ្នាក់:</strong> <span id="info-class" class="text-blue-700"></span></p>
            </div>
        </div>

        <!-- Section 2: Camera View -->
        <div id="camera-container" class="hidden text-center space-y-4">
            <div id="video-container">
                <video id="video" autoplay playsinline></video>
                <div id="overlay"></div>
            </div>
            <div class="flex items-center space-x-4">
                <button id="capture-btn" class="flex-grow bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors shadow-md">
                    ថតរូប
                </button>
                <button id="switch-camera-btn" title="ប្តូរកាមេរ៉ា" class="flex-shrink-0 bg-gray-600 text-white p-3 rounded-full hover:bg-gray-700 transition-colors shadow-md" aria-label="Switch Camera">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
            </div>
        </div>

        <!-- Section 3: Captured Image & Upload -->
        <div id="capture-container" class="hidden text-center space-y-4">
            <canvas id="canvas" class="hidden"></canvas>
            <img id="captured-image" class="rounded-lg shadow-md w-full max-w-xs mx-auto" src="" alt="Captured Photo">
            <div id="upload-status" class="text-center h-6"></div>
            <div class="flex space-x-2">
                <button id="recapture-btn" class="w-1/2 bg-gray-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-gray-600 transition-colors">ថតឡើងវិញ</button>
                <button id="upload-btn" class="w-1/2 bg-gray-400 text-white font-bold py-3 px-4 rounded-lg cursor-not-allowed" disabled>បញ្ជូនរូបភាព</button>
            </div>
        </div>
        
        <!-- Section 4: Success Message -->
        <div id="success-container" class="hidden text-center p-6 bg-green-100 rounded-lg border border-green-300">
            <h2 class="text-xl font-bold text-green-800">ជោគជ័យ!</h2>
            <p id="success-message" class="text-green-700 mt-2"></p>
            <button id="reset-btn" class="mt-4 bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition-colors">ចាប់ផ្តើមម្តងទៀត</button>
        </div>

    </div>

    <!-- Face Detection Library -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        // --- CONFIGURATION ---
        // !!! IMPORTANT: PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE !!!
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxTi_h8wcu6kweyvi22RLSL5ElyE00A9tDpLGHt0cx3ZORQ4ZiS9XxaRHMkF7CfKM4M/exec';
        
        const API_KEY = 'AIzaSyASQ2q3LqxKznkg4MFK1DEeir24FcA8Xnw';
        const SPREADSHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const SHEET_NAME = 'DIList';
        const RANGES = [`${SHEET_NAME}!E9:E`, `${SHEET_NAME}!L9:L`, `${SHEET_NAME}!R9:R`];
        
        const FOLDER_CONFIG = {
            'DEE1': '1WrWvC4f8YmdtvZDnxWGT3Xkj01n5K3m4',
            'DEE2': '18mM6ivvbd9dkToDVXc9hY83BBVcCN93M'
        };

        // --- DOM ELEMENTS ---
        const loader = document.getElementById('loader');
        const searchForm = document.getElementById('search-form');
        const studentSearchInput = document.getElementById('student-search');
        const studentList = document.getElementById('student-list');
        const studentInfoDiv = document.getElementById('student-info');
        
        const selectionContainer = document.getElementById('selection-container');
        const cameraContainer = document.getElementById('camera-container');
        const captureContainer = document.getElementById('capture-container');
        const successContainer = document.getElementById('success-container');
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const switchCameraBtn = document.getElementById('switch-camera-btn');
        const recaptureBtn = document.getElementById('recapture-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const resetBtn = document.getElementById('reset-btn');
        const capturedImage = document.getElementById('captured-image');
        const uploadStatus = document.getElementById('upload-status');
        const successMessage = document.getElementById('success-message');

        // --- STATE VARIABLES ---
        let students = [];
        let selectedStudent = null;
        let stream = null;
        let currentFacingMode = 'environment'; // Default to rear camera

        // --- FUNCTIONS ---
        
        async function loadModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
            try {
                loader.innerHTML = '<p>កំពុងដំណើរការម៉ូដែលវិភាគមុខ...</p>';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            } catch (error) {
                console.error("Error loading face-api models:", error);
                loader.innerHTML = '<p class="text-red-500">Error loading AI model.</p>';
            }
        }

        async function fetchStudentData() {
            loader.innerHTML = '<p>កំពុងទាញយកទិន្នន័យសិស្ស...</p>';
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values:batchGet?ranges=${RANGES.join('&ranges=')}&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Error fetching data: ${response.statusText}`);
                const data = await response.json();
                
                const ids = data.valueRanges[0].values || [];
                const names = data.valueRanges[1].values || [];
                const classes = data.valueRanges[2].values || [];
                const maxLength = Math.max(ids.length, names.length, classes.length);
                
                for (let i = 0; i < maxLength; i++) {
                    const id = ids[i]?.[0] || '';
                    const name = names[i]?.[0] || '';
                    const studentClass = classes[i]?.[0] || 'N/A';
                    if (id && name) students.push({ id, name, class: studentClass });
                }
                
                populateDatalist();
                loader.classList.add('hidden');
                searchForm.classList.remove('hidden');

            } catch (error) {
                console.error("Failed to fetch student data:", error);
                loader.textContent = 'ទាញយកទិន្នន័យមិនបានសម្រេច។ សូមព្យាយាមម្តងទៀត។';
            }
        }

        function populateDatalist() {
            students.forEach(student => {
                const optionId = document.createElement('option');
                optionId.value = student.id;
                optionId.textContent = `${student.name} (${student.class})`;
                studentList.appendChild(optionId);
                const optionName = document.createElement('option');
                optionName.value = student.name;
                optionName.textContent = `${student.id} (${student.class})`;
                studentList.appendChild(optionName);
            });
        }
        
        function handleStudentSelection(event) {
            const value = event.target.value;
            const student = students.find(s => s.id === value || s.name === value);

            if (student) {
                selectedStudent = student;
                document.getElementById('info-id').textContent = student.id;
                document.getElementById('info-name').textContent = student.name;
                document.getElementById('info-class').textContent = student.class;
                studentInfoDiv.classList.remove('hidden');
                
                setTimeout(() => {
                    selectionContainer.classList.add('hidden');
                    cameraContainer.classList.remove('hidden');
                    startCamera();
                }, 1000);
            } else {
                selectedStudent = null;
                studentInfoDiv.classList.add('hidden');
            }
        }

        async function startCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            try {
                const constraints = { video: { facingMode: currentFacingMode } };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert(`មិនអាចបើកកាមេរ៉ា (${currentFacingMode}) បានទេ។ សូមអនុញ្ញាតឱ្យប្រើប្រាស់កាមេរ៉ា។`);
            }
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function capturePhoto() {
            const context = canvas.getContext('2d');
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = 3 / 4;
            canvas.width = 600;
            canvas.height = 800;
            let sx, sy, sWidth, sHeight;
            if (videoRatio > canvasRatio) {
                sHeight = video.videoHeight;
                sWidth = sHeight * canvasRatio;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                sWidth = video.videoWidth;
                sHeight = sWidth / canvasRatio;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }
            context.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
            capturedImage.src = canvas.toDataURL('image/jpeg');
            stopCamera();
            cameraContainer.classList.add('hidden');
            captureContainer.classList.remove('hidden');
            validatePhoto();
        }
        
        function enableUploadButton() {
            uploadBtn.disabled = false;
            uploadBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
            uploadBtn.classList.add('bg-green-600', 'hover:bg-green-700');
        }

        function disableUploadButton() {
            uploadBtn.disabled = true;
            uploadBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
            uploadBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
        }

        async function validatePhoto() {
            uploadStatus.innerHTML = '<p class="text-blue-500 font-bold">កំពុងពិនិត្យរូបភាព...</p>';
            disableUploadButton();

            try {
                const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions());
                if (detections.length === 1) {
                    const faceBox = detections[0].box;
                    const faceArea = faceBox.width * faceBox.height;
                    const imageArea = canvas.width * canvas.height;
                    
                    if ((faceArea / imageArea) < 0.15) {
                        uploadStatus.innerHTML = '<p class="text-red-500 font-bold">មុខនៅឆ្ងាយពេក! សូមថតឲ្យជិតជាងនេះ។</p>';
                    } else {
                        uploadStatus.innerHTML = '<p class="text-green-500 font-bold">រូបភាពត្រឹមត្រូវ!</p>';
                        enableUploadButton();
                    }
                } else if (detections.length > 1) {
                    uploadStatus.innerHTML = '<p class="text-red-500 font-bold">មានមុខច្រើនពេក! សូមថតឲ្យឃើញតែម្នាក់។</p>';
                } else {
                    uploadStatus.innerHTML = '<p class="text-red-500 font-bold">រកមិនឃើញមុខ! សូមដាក់មុខឲ្យចំកណ្តាល។</p>';
                }
            } catch (error) {
                console.error("Face detection error:", error);
                uploadStatus.innerHTML = '<p class="text-red-500 font-bold">ការវិភាគរូបភាពមានបញ្ហា។</p>';
            }
        }

        async function handleUpload() {
            if (!selectedStudent) return alert("សូមជ្រើសរើសសិស្សជាមុនសិន។");
            if (APPS_SCRIPT_URL === 'សូមដាក់ URL របស់ WEB APP ដែលបាន DEPLOY នៅទីនេះ' || !APPS_SCRIPT_URL) {
                alert('សូមកំណត់ค่า APPS_SCRIPT_URL ในโค้ดก่อน');
                return;
            }

            const studentClass = selectedStudent.class;
            const folderId = FOLDER_CONFIG[studentClass];
            if (!folderId) {
                uploadStatus.innerHTML = `<p class="text-red-500 font-bold">Error: មិនមាន Folder សម្រាប់ថ្នាក់ '${studentClass}' ទេ។</p>`;
                return;
            }

            uploadBtn.disabled = true;
            recaptureBtn.disabled = true;
            uploadStatus.innerHTML = `<p class="text-blue-500 font-bold">កំពុងបញ្ជូនរូបភាព...</p>`;

            try {
                const imageData = canvas.toDataURL('image/jpeg').split(',')[1];
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const fileName = `${selectedStudent.id}_${timestamp}.jpg`;

                const payload = {
                    imageData: imageData,
                    fileName: fileName,
                    folderId: folderId
                };

                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' },
                });

                const result = await response.json();

                if (result.status === 'success') {
                    captureContainer.classList.add('hidden');
                    successContainer.classList.remove('hidden');
                    successMessage.innerHTML = `រូបភាព <strong class="text-gray-900">${fileName}</strong> ត្រូវបានបញ្ជូនទៅកាន់ Google Drive ដោយជោគជ័យ។`;
                } else {
                    throw new Error(result.message || 'Unknown error occurred during upload.');
                }
            } catch (error) {
                console.error('Upload failed:', error);
                uploadStatus.innerHTML = `<p class="text-red-500 font-bold">បញ្ជូនរូបភាពមិនបានសម្រេច៖ ${error.message}</p>`;
                uploadBtn.disabled = false;
                recaptureBtn.disabled = false;
            }
        }

        function resetApp() {
            stopCamera();
            selectedStudent = null;
            studentSearchInput.value = '';
            studentInfoDiv.classList.add('hidden');
            successContainer.classList.add('hidden');
            cameraContainer.classList.add('hidden');
            captureContainer.classList.add('hidden');
            selectionContainer.classList.remove('hidden');
            recaptureBtn.disabled = false;
            uploadStatus.innerHTML = '';
            disableUploadButton();
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', async () => {
            await loadModels();
            await fetchStudentData();
        });
        studentSearchInput.addEventListener('input', handleStudentSelection);
        captureBtn.addEventListener('click', capturePhoto);
        switchCameraBtn.addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });
        recaptureBtn.addEventListener('click', () => {
            captureContainer.classList.add('hidden');
            cameraContainer.classList.remove('hidden');
            uploadStatus.innerHTML = '';
            disableUploadButton();
            startCamera();
        });
        uploadBtn.addEventListener('click', handleUpload);
        resetBtn.addEventListener('click', resetApp);

    </script>
</body>
</html>
