<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Photo Capture App (កម្មវិធីថតរូបសិស្ស)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Koulen&family=Moul&family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tom Select CSS for smart dropdown -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Khmer', 'Koulen', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .moul-font {
            font-family: 'Moul', cursive;
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        video {
            transform: scaleX(-1); /* Mirror effect for front camera */
        }
        /* Tom Select custom styling */
        .ts-control {
            padding: 0.75rem !important;
            border-radius: 0.5rem !important;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }
        .ts-dropdown {
            border-radius: 0.5rem !important;
        }
    </style>
</head>
<body class="bg-gray-200">

    <div class="flex flex-col lg:flex-row h-screen overflow-hidden">
        
        <!-- Control Panel (Left Side / Full screen on mobile) -->
        <div id="selection-panel" class="w-full lg:w-1/3 bg-white p-6 shadow-lg flex flex-col h-full overflow-y-auto">
            <h1 class="text-3xl font-bold text-center text-blue-800 mb-6 moul-font">កម្មវិធីថតរូបសិស្ស</h1>

            <!-- Student Selection -->
            <div class="space-y-4 mb-6">
                <div>
                    <label for="student-search-select" class="block text-md font-bold text-gray-700 mb-2">ស្វែងរក (អត្តលេខ ឬ ឈ្មោះ)</label>
                    <select id="student-search-select" placeholder="វាយបញ្ចូលអត្តលេខ ឬ ឈ្មោះដើម្បីស្វែងរក..."></select>
                </div>
            </div>

            <!-- Student Info Display -->
            <div id="student-info-card" class="bg-blue-50 p-5 rounded-lg border border-blue-200 hidden">
                <h2 class="text-2xl font-bold text-blue-700 mb-4 moul-font">ព័ត៌មានសិស្ស</h2>
                <div class="space-y-3 text-lg">
                    <p><strong>អត្តលេខ:</strong> <span id="info-id" class="font-mono text-gray-800"></span></p>
                    <p><strong>ឈ្មោះ:</strong> <span id="info-name" class="text-gray-800"></span></p>
                    <p><strong>ថ្នាក់:</strong> <span id="info-class" class="font-mono text-red-600 font-bold"></span></p>
                </div>
            </div>
            
             <!-- Message Box -->
            <div id="message-box" class="mt-auto pt-6"></div>

        </div>

        <!-- Camera View (Right Side / Full screen on mobile) -->
        <div id="camera-panel" class="w-full lg:w-2/3 bg-gray-800 flex-col items-center justify-center p-4 relative h-full hidden lg:flex">
            <!-- Back Button (Mobile only) -->
            <button id="back-btn" title="ត្រឡប់ក្រោយ" class="absolute top-4 left-4 z-20 p-3 bg-white/20 rounded-full hover:bg-white/40 transition lg:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <div id="camera-container" class="w-auto h-[85%] max-h-[800px] aspect-[9/16] bg-black rounded-lg overflow-hidden relative shadow-2xl">
                <video id="video" class="w-full h-full object-cover" playsinline autoplay muted></video>
                <canvas id="canvas" class="hidden"></canvas>
                <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-white bg-gray-900 z-10">
                    <svg class="w-16 h-16 text-gray-500 mb-4 animate-pulse" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.776 48.776 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" /></svg>
                    <p id="camera-status" class="text-lg">កំពុងចាប់ផ្តើមដំណើរការកាមេរ៉ា...</p>
                </div>
            </div>
            <div class="flex items-center justify-center gap-4 mt-4 w-full max-w-md">
                <button id="capture-btn" class="flex-grow bg-green-600 text-white font-bold py-4 px-6 rounded-lg hover:bg-green-700 transition duration-300 text-xl disabled:bg-gray-500 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    ថត និងរក្សាទុក
                </button>
                 <button id="flip-camera-btn" title="ប្តូរកាមេរ៉ា" class="p-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-300 disabled:bg-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 20h5v-5M20 4h-5v5" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 4h5v5M9 20H4v-5M15 20h5v-5M9 4H4v5" />
                    </svg>
                </button>
            </div>
        </div>

    </div>
    
    <!-- Tom Select JS for smart dropdown -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script>
        // --- Google Sheets API Configuration ---
        const API_KEY = 'AIzaSyASQ2q3LqxKznkg4MFK1DEeir24FcA8Xnw';
        const SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const RANGE = 'DIList!E9:R';
        const URL = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
        
        // --- DATA SOURCE ---
        let studentData = [];
        const folderMapping = { 'DEE1': '1WrWC4f8YmdtvZDnxWGT3Xkj01n5K3m4', 'DEE2': '18mM6ivvbd9dkToDVXc9hY83BBVcCN93M' };

        // --- DOM Elements ---
        const selectionPanel = document.getElementById('selection-panel');
        const cameraPanel = document.getElementById('camera-panel');
        const studentInfoCard = document.getElementById('student-info-card');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const flipCameraBtn = document.getElementById('flip-camera-btn');
        const backBtn = document.getElementById('back-btn');
        const messageBox = document.getElementById('message-box');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        const cameraStatus = document.getElementById('camera-status');

        // --- State Management ---
        let currentStream;
        let facingMode = 'environment'; // 'environment' for rear, 'user' for front
        let photographedStudents = JSON.parse(localStorage.getItem('photographedStudents')) || [];
        let tomSelectInstance;

        // --- Functions ---
        async function fetchStudentData() {
            try {
                const response = await fetch(URL);
                if (!response.ok) {
                    throw new Error(`Error fetching data: ${response.statusText}`);
                }
                const data = await response.json();
                const rows = data.values || [];
                
                studentData = rows.map(row => ({
                    id: row[0],    // Column E
                    name: row[7],  // Column L (index 7 from E)
                    class: row[13] // Column R (index 13 from E)
                })).filter(student => student.id && student.name && student.class);

            } catch (error) {
                console.error('Could not fetch student data:', error);
                showMessage('error', 'ទាញទិន្នន័យបរាជ័យ', 'សូមពិនិត្យ API Key ឬការតភ្ជាប់អ៊ីនធឺណិត។');
            }
        }
        
        function stopCurrentStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
        }

        async function startCamera() {
            // No need to start camera if it's already running.
            if (currentStream && currentStream.active) return;
            
            stopCurrentStream();
            captureBtn.disabled = true;
            flipCameraBtn.disabled = true;
            cameraPlaceholder.classList.remove('hidden');

            const constraints = { video: { facingMode: { ideal: facingMode } }, audio: false };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                video.onloadedmetadata = () => {
                    const track = currentStream.getVideoTracks()[0];
                    const settings = track.getSettings();
                    video.style.transform = settings.facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
                    cameraPlaceholder.classList.add('hidden');
                    captureBtn.disabled = false;
                    flipCameraBtn.disabled = false;
                };
            } catch (err) {
                console.error("Error accessing camera: ", err);
                cameraStatus.innerHTML = `<span class="text-red-400">បរាជ័យក្នុងការបើកកាមេរ៉ា។<br>សូមអនុញ្ញាតឲ្យប្រើប្រាស់កាមេរ៉ា។</span>`;
                if (facingMode === 'environment') {
                    console.log("Retrying with front camera...");
                    facingMode = 'user';
                    startCamera();
                }
            }
        }

        function showView(viewName) {
             // This logic applies only to mobile screens (under lg breakpoint)
            if (window.innerWidth < 1024) {
                if (viewName === 'camera') {
                    selectionPanel.classList.add('hidden');
                    cameraPanel.classList.remove('hidden');
                    cameraPanel.classList.add('flex');
                    startCamera();
                } else { // 'selection' view
                    selectionPanel.classList.remove('hidden');
                    cameraPanel.classList.add('hidden');
                    stopCurrentStream();
                }
            } else {
                 // On desktop, both views are visible, just ensure camera starts
                 startCamera();
            }
        }
        
        function initializeOrUpdateTomSelect() {
            if (tomSelectInstance) {
                tomSelectInstance.destroy();
            }

            const availableStudents = studentData.filter(s => !photographedStudents.includes(s.id));
            const selectOptions = availableStudents.map(student => ({
                value: student.id,
                text: `${student.id} - ${student.name}`,
                name: student.name,
                id: student.id
            }));

            tomSelectInstance = new TomSelect('#student-search-select', {
                options: selectOptions,
                valueField: 'value',
                labelField: 'text',
                searchField: ['text'],
                create: false,
                placeholder: 'វាយបញ្ចូលអត្តលេខ ឬ ឈ្មោះ...',
                render: {
                    option: function(data, escape) {
                        return `<div>
                                    <span class="font-bold text-gray-800">${escape(data.id)}</span>
                                    <span class="text-sm text-gray-600 ml-2">${escape(data.name)}</span>
                                </div>`;
                    },
                    item: function(data, escape) {
                        return `<div>${escape(data.text)}</div>`;
                    }
                },
                onChange: (value) => {
                    handleSelection(value);
                    if (value) {
                       showView('camera');
                    }
                }
            });

            if (availableStudents.length === 0) {
                tomSelectInstance.disable();
                tomSelectInstance.settings.placeholder = '-- មិនមានសិស្សសម្រាប់ថត --';
                tomSelectInstance.sync();
            } else {
                tomSelectInstance.enable();
            }
        }

        function displayStudentInfo(studentId) {
             const student = studentData.find(s => s.id === studentId);
            if (student) {
                document.getElementById('info-id').textContent = student.id;
                document.getElementById('info-name').textContent = student.name;
                document.getElementById('info-class').textContent = student.class;
                studentInfoCard.classList.remove('hidden');
                return true;
            } else {
                studentInfoCard.classList.add('hidden');
                return false;
            }
        }

        function handleSelection(selectedValue) {
             if (selectedValue) {
                displayStudentInfo(selectedValue);
            } else {
                studentInfoCard.classList.add('hidden');
            }
        }
        
        function showMessage(type, title, text) {
            const bgColor = type === 'success' ? 'bg-green-100 border-green-400' : 'bg-red-100 border-red-400';
            const textColor = type === 'success' ? 'text-green-800' : 'text-red-800';
            
            messageBox.innerHTML = `
                <div class="${bgColor} border-l-4 p-4 rounded-md" role="alert">
                  <p class="font-bold">${title}</p>
                  <p>${text}</p>
                </div>`;
            
            setTimeout(() => {
                messageBox.innerHTML = '';
            }, 8000);
        }

        async function captureAndSave() {
            const studentId = tomSelectInstance.getValue();
            if (!studentId) {
                showMessage('error', 'ប្រតិបត្តិការបរាជ័យ', 'សូមជ្រើសរើសសិស្សជាមុនសិន!');
                return;
            }
            const student = studentData.find(s => s.id === studentId);

            captureBtn.disabled = true;
            captureBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                កំពុង Upload...`;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            if (video.style.transform === 'scaleX(-1)') {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            setTimeout(() => {
                const dataUrl = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                const fileName = `${student.class}_${student.id}_${student.name.replace(/\s+/g, '_')}.png`;
                link.download = fileName;
                link.href = dataUrl;
                link.click();
                
                photographedStudents.push(student.id);
                localStorage.setItem('photographedStudents', JSON.stringify(photographedStudents));
                
                tomSelectInstance.clear();
                tomSelectInstance.removeOption(student.id);
                studentInfoCard.classList.add('hidden');

                const folderId = folderMapping[student.class] || 'N/A';
                showMessage('success', 'ប្រតិបត្តិការជោគជ័យ!', 
                    `រូបថតសម្រាប់ <strong>${student.name}</strong> ត្រូវបានទាញយក។ សូមបង្ហោះវាទៅកាន់ Google Drive Folder ID: <strong>${folderId}</strong>`);
                
                captureBtn.disabled = false;
                captureBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    ថត និងរក្សាទុក`;
                
                showView('selection');
            }, 1500);
        }
        
        // --- Event Listeners ---
        flipCameraBtn.addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        });
        
        captureBtn.addEventListener('click', captureAndSave);
        
        backBtn.addEventListener('click', () => {
            tomSelectInstance.clear();
            showView('selection');
        });

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchStudentData();
            initializeOrUpdateTomSelect();
            if (window.innerWidth >= 1024) { // lg breakpoint
                startCamera();
            }
        });
    </script>
</body>
</html>
